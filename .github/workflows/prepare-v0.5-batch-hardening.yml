name: Prepare v0.5 batch hardening

on:
  push:
    branches: ["feat/v0.5-batch-hardening"]
    paths:
      - ".github/workflows/prepare-v0.5-batch-hardening.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.5-batch-hardening

      - name: Apply v0.5 batch hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("main.py")
          text = main_path.read_text(encoding="utf-8")
          text = text.replace('VERSION = "0.4.0"', 'VERSION = "0.5.0-dev"', 1)

          old = 'def normalize_amount(amount, base, quote, rate_date=None, provider=None):'
          new = 'def normalize_amount(amount, base, quote, rate_date=None, provider=None, rate_cache=None):'
          if old not in text:
              raise SystemExit("normalize_amount signature not found")
          text = text.replace(old, new, 1)

          old = '''    provider = validate_provider(provider)\n\n    rate, applied_rate_date = get_rate(\n        base,\n        quote,\n        rate_date,\n        provider=provider,\n    )\n'''
          new = '''    provider = validate_provider(provider)\n    rate_date = validate_rate_date(rate_date)\n    cache_key = (base, quote, rate_date, provider)\n\n    if rate_cache is not None and cache_key in rate_cache:\n        rate, applied_rate_date = rate_cache[cache_key]\n    else:\n        rate, applied_rate_date = get_rate(\n            base,\n            quote,\n            rate_date,\n            provider=provider,\n        )\n        if rate_cache is not None:\n            rate_cache[cache_key] = (rate, applied_rate_date)\n'''
          if old not in text:
              raise SystemExit("normalize_amount rate block not found")
          text = text.replace(old, new, 1)

          old = 'def normalize_quote(quote, target_currency, rate_date=None, provider=None):'
          new = 'def normalize_quote(quote, target_currency, rate_date=None, provider=None, rate_cache=None):'
          if old not in text:
              raise SystemExit("normalize_quote signature not found")
          text = text.replace(old, new, 1)

          old = '''        rate_date=rate_date,\n        provider=provider,\n    )\n\n    normalized = dict(quote)'''
          new = '''        rate_date=rate_date,\n        provider=provider,\n        rate_cache=rate_cache,\n    )\n\n    normalized = dict(quote)'''
          if old not in text:
              raise SystemExit("normalize_quote normalize_amount call not found")
          text = text.replace(old, new, 1)

          old = 'def normalize_quote_files(paths, target_currency, rate_date=None, provider=None):\n    normalized = []\n'
          new = 'def normalize_quote_files(paths, target_currency, rate_date=None, provider=None, rate_cache=None):\n    normalized = []\n    rate_cache = {} if rate_cache is None else rate_cache\n'
          if old not in text:
              raise SystemExit("normalize_quote_files block not found")
          text = text.replace(old, new, 1)

          old = '''                    rate_date=rate_date,\n                    provider=provider,\n                ),\n'''
          new = '''                    rate_date=rate_date,\n                    provider=provider,\n                    rate_cache=rate_cache,\n                ),\n'''
          if old not in text:
              raise SystemExit("normalize_quote_files call not found")
          text = text.replace(old, new, 1)

          marker = '\ndef write_batch_outputs(\n'
          helper = '''\ndef plan_batch_output_paths(items, output_dir, target_currency):\n    output_dir = Path(output_dir)\n    target_currency = validate_currency(target_currency, "target_currency")\n    seen = {}\n    destinations = []\n\n    for item in items:\n        source = Path(item["source"])\n        filename = f"{source.stem}_{target_currency.lower()}.json"\n        key = filename.casefold()\n        entry = seen.setdefault(\n            key,\n            {"filename": filename, "sources": []},\n        )\n        entry["sources"].append(str(source))\n        destinations.append(output_dir / filename)\n\n    collisions = [\n        entry for entry in seen.values() if len(entry["sources"]) > 1\n    ]\n    if collisions:\n        details = "; ".join(\n            f"{entry['filename']}: {', '.join(entry['sources'])}"\n            for entry in sorted(\n                collisions,\n                key=lambda entry: entry["filename"].casefold(),\n            )\n        )\n        raise ValueError(f"batch output filename collision(s): {details}")\n\n    return destinations\n\n\n'''
          if marker not in text:
              raise SystemExit("write_batch_outputs marker not found")
          text = text.replace(marker, helper + 'def write_batch_outputs(\n', 1)

          text = text.replace(
              '    output_dir = Path(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n\n    effective_policy = policy or build_effective_policy(',
              '    output_dir = Path(output_dir)\n\n    effective_policy = policy or build_effective_policy(',
              1,
          )

          old = '    effective_policy = validate_policy_document(effective_policy)\n\n    sources = [item["source"] for item in items]\n'
          new = '''    effective_policy = validate_policy_document(effective_policy)\n    destinations = plan_batch_output_paths(\n        items,\n        output_dir,\n        effective_policy["base_currency"],\n    )\n    output_dir.mkdir(parents=True, exist_ok=True)\n\n    sources = [item["source"] for item in items]\n'''
          if old not in text:
              raise SystemExit("effective policy block not found")
          text = text.replace(old, new, 1)

          old = '''    files = []\n    for item in items:\n        source = Path(item["source"])\n        destination = output_dir / (\n            f"{source.stem}_{effective_policy['base_currency'].lower()}.json"\n        )\n'''
          new = '''    files = []\n    for index, item in enumerate(items):\n        source = Path(item["source"])\n        destination = destinations[index]\n'''
          if old not in text:
              raise SystemExit("output destination block not found")
          text = text.replace(old, new, 1)
          main_path.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_currency_normalizer.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace('self.assertEqual(result["version"], "0.4.0")', 'self.assertEqual(result["version"], "0.5.0-dev")', 1)
          marker = '\n\nif __name__ == "__main__":\n'
          additions = '''\n    def test_batch_reuses_rate_for_duplicate_pair(self):\n        quote_a = {\n            "name": "Supplier A",\n            "currency": "USD",\n            "price": 100,\n            "lead_time_weeks": 6,\n            "payment_days": 30,\n        }\n        quote_b = {\n            "name": "Supplier B",\n            "currency": "USD",\n            "price": 200,\n            "lead_time_weeks": 8,\n            "payment_days": 45,\n        }\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            path_a = root / "supplier_a.json"\n            path_b = root / "supplier_b.json"\n            path_a.write_text(json.dumps(quote_a), encoding="utf-8")\n            path_b.write_text(json.dumps(quote_b), encoding="utf-8")\n            with patch(\n                "main.get_rate",\n                return_value=(Decimal("0.92"), "2026-08-01"),\n            ) as mocked_get_rate:\n                items = normalize_quote_files(\n                    [path_a, path_b],\n                    "EUR",\n                    rate_date="2026-08-01",\n                    provider="ECB",\n                )\n        self.assertEqual(mocked_get_rate.call_count, 1)\n        self.assertEqual(items[0]["quote"]["price"], 92.0)\n        self.assertEqual(items[1]["quote"]["price"], 184.0)\n\n    def test_output_filename_collision_fails_before_writing(self):\n        quote = {\n            "name": "Supplier",\n            "currency": "EUR",\n            "price": 100,\n            "lead_time_weeks": 6,\n            "payment_days": 30,\n        }\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            first_dir = root / "first"\n            second_dir = root / "second"\n            first_dir.mkdir()\n            second_dir.mkdir()\n            first_path = first_dir / "supplier.json"\n            second_path = second_dir / "supplier.json"\n            first_path.write_text(json.dumps(quote), encoding="utf-8")\n            second_path.write_text(json.dumps(quote), encoding="utf-8")\n            items = normalize_quote_files([first_path, second_path], "EUR")\n            output_dir = root / "normalized"\n            with self.assertRaisesRegex(ValueError, "filename collision"):\n                write_batch_outputs(items, output_dir, "EUR")\n            self.assertFalse(output_dir.exists())\n'''
          if marker not in tests:
              raise SystemExit("test insertion marker not found")
          tests = tests.replace(marker, additions + marker, 1)
          tests_path.write_text(tests, encoding="utf-8")

          version_test_path = Path("tests/test_release_version.py")
          version_tests = version_test_path.read_text(encoding="utf-8")
          version_tests = version_tests.replace(
              'def test_runtime_version_is_v040(self):\n        self.assertEqual(main.VERSION, "0.4.0")',
              'def test_runtime_version_is_v050_dev(self):\n        self.assertEqual(main.VERSION, "0.5.0-dev")',
              1,
          )
          version_test_path.write_text(version_tests, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = '# Changelog\n\n'
          new_section = '''## Unreleased — v0.5.0\n\n- Cache repeated FX lookups per currency pair, rate date and provider within a batch run.\n- Fail before writing batch outputs when source files would map to the same normalized filename.\n- Add regression coverage for within-run FX consistency and output collision safety.\n\n'''
          if heading not in changelog:
              raise SystemExit("changelog heading not found")
          changelog = changelog.replace(heading, heading + new_section, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              '- batch normalization manifests;\n',
              '- batch normalization manifests;\n- batch-local FX lookup caching for within-run rate consistency;\n- fail-fast normalized-output filename collision detection;\n',
              1,
          )
          old_status = '''Latest published release: **v0.3.0**.\n\n`main` now also contains the post-v0.3 reproducible portfolio-run work: reusable base-currency policy, deterministic run identity, source/output SHA-256 lineage and stronger portfolio provenance. These capabilities are present on `main` but should be treated as the next release line until a new tagged release is published.'''
          new_status = '''Latest published release: **v0.4.0**.\n\nDevelopment line: **v0.5.0-dev**, focused on batch execution consistency and collision-safe output handling. The v0.4.0 portfolio policy, deterministic run identity and SHA-256 lineage contracts remain the released baseline.'''
          if old_status not in readme:
              raise SystemExit("README status block not found")
          readme = readme.replace(old_status, new_status, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Verify feature diff and unit tests
        run: |
          git diff --check
          python -m unittest discover -s tests -v

      - name: Commit v0.5 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tests/test_currency_normalizer.py tests/test_release_version.py README.md CHANGELOG.md
          git commit -m "feat: harden v0.5 batch execution consistency"
          git push origin HEAD:feat/v0.5-batch-hardening
